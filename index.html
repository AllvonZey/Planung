<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Fixkosten</title>
<style>
:root{--wine:#762b3d;--wine2:#963e52;--orange:#f29a43;--cream:#fff8f1;--ink:#33272b;--muted:#796b6e;--line:#eadbd6;--white:#fff;--green:#31785a;--red:#b44343}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(25px + env(safe-area-inset-bottom))}header{background:linear-gradient(130deg,var(--wine),var(--wine2));color:#fff;padding:24px 18px 20px;border-radius:0 0 24px 24px}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;opacity:.85;font-size:14px}.tabs{display:flex;gap:8px;padding:12px;overflow-x:auto;position:sticky;top:0;background:var(--cream);z-index:2}.tab{border:0;border-radius:999px;padding:11px 15px;background:#f1e3df;color:var(--wine);font-weight:700;white-space:nowrap}.tab.active{background:var(--wine);color:#fff}.main{padding:0 13px 25px;max-width:900px;margin:auto}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #682d3d0a}.panel h2,.panel h3{margin:0 0 10px;color:var(--wine)}h2{font-size:20px}h3{font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font-size:13px;font-weight:650;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #ddc9c5;border-radius:10px;background:#fff;padding:11px;font-size:16px;color:var(--ink);min-height:43px}textarea{min-height:72px}.btn{border:0;border-radius:11px;background:var(--wine);color:#fff;font-weight:700;padding:12px 15px;font-size:15px;cursor:pointer}.btn.orange{background:var(--orange);color:#4b2a1b}.btn.light{background:#f3e7e2;color:var(--wine)}.btn.danger{background:#f7e1df;color:var(--red)}.btn.small{padding:8px 10px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{display:inline-block;background:#f6e9e2;border-radius:99px;padding:5px 9px;font-size:12px;color:var(--wine);font-weight:700}.stat{background:linear-gradient(140deg,#fff5e9,#f8e8e3);border-radius:13px;padding:13px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:21px;color:var(--wine)}.listitem{padding:11px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.listitem .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.listitem strong{display:block}.listitem small{color:var(--muted)}.monthgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.monthcard{border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff}.monthcard h4{margin:0 0 7px;color:var(--wine);display:flex;justify-content:space-between}.due{font-size:13px;padding:5px 0;border-top:1px solid #f2e9e6}.due b{float:right}.checkboxes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.check{background:#f6eeeb;border-radius:8px;padding:7px 5px;text-align:center;font-size:13px}.check input{width:auto;min-height:0;margin:0 4px 0 0}.notice{background:#fff1d9;border:1px solid #f4d4a0;color:#6d4718;border-radius:12px;padding:12px;font-size:14px}.alert{background:#fde8e6;color:#8d2828;border:1px solid #efc0bc}.muted{color:var(--muted)}.hidden{display:none!important}.empty{color:var(--muted);font-size:14px;padding:10px 0}.yearsel{max-width:150px}.cardrow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px 7px}th{color:var(--wine)}footer{text-align:center;color:var(--muted);font-size:12px;padding:10px}
@media(min-width:650px){.monthgrid{grid-template-columns:repeat(3,1fr)}.main{padding-left:20px;padding-right:20px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media print{body{background:#fff;padding:0}header,.tabs,.actions,.btn,.no-print,footer{display:none!important}.main{max-width:none;padding:0}.panel{box-shadow:none;border:0;padding:0;margin:0 0 15px}.monthcard{break-inside:avoid}.monthgrid{grid-template-columns:repeat(3,1fr)}.printpage{page-break-after:always}h2{font-size:22px}}
</style></head><body>
<header><h1>Fixkosten</h1><p>Dein persönlicher Überblick über Ausgaben, Einnahmen und Geldanlagen</p></header>
<nav class="tabs" id="tabs"><button class="tab active" data-tab="expenses">Fixkosten</button><button class="tab" data-tab="income">Geldeingänge</button><button class="tab" data-tab="banks">Banken</button><button class="tab" data-tab="reports">Auswertungen</button><button class="tab" data-tab="manage">Rubriken</button><button class="tab" data-tab="backup">Datensicherung</button></nav>
<div class="main" id="app"></div><footer>Deine Daten bleiben grundsätzlich auf diesem Gerät gespeichert. Bitte regelmäßig eine Sicherung herunterladen.</footer>
<script>
(()=>{
const KEY='fixkostenFinanceDataV1', months=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],shortMonths=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const defaults={expenses:[{name:'Wohnen',subs:['Miete','Strom','Gas','Handy','Rundfunkgebühr']},{name:'Versicherungen',subs:['Privathaftpflicht','Unfall / Alltagshilfe','Rechtsschutz','Hausrat','Private Krankenversicherung']},{name:'Auto',subs:['ADAC','Kfz-Steuer','Kfz-Versicherung','Inspektion','Reifenwechsel']}],income:[{name:'Geldeingänge',subs:['Rente','Zinsen','Dividenden']}],banks:[{name:'Banken',subs:['Girokonto','Tagesgeld','Festgeld','Depot','Sparkonto','Sonstiges']}]};
const fresh=()=>({categories:JSON.parse(JSON.stringify(defaults)),expenses:[],income:[],banks:[],extras:[],allowance:1000,activeYear:new Date().getFullYear(),lastReportPromptYear:null});
let data;
try{
  const saved=localStorage.getItem(KEY);
  if(saved){data=JSON.parse(saved)}
  else {
    data=fresh();
    // Einmalige Übernahme der älteren Fixkosten-App, sofern vorhanden.
    const legacyRaw=localStorage.getItem('fixkostenAppData');
    if(legacyRaw){
      const legacy=JSON.parse(legacyRaw);
      if(legacy && Array.isArray(legacy.entries)){
        data.expenses=legacy.entries.map(e=>({
          id:e.id||('legacy-'+Math.random().toString(36).slice(2)), category:e.category||'Wohnen', subcategory:e.subcategory||'Sonstiges',
          amount:Number(e.amount)||0, frequency:e.frequency||'Monatlich',
          months:Array.isArray(e.months)?e.months:[], details:e.details||''
        }));
      }
      if(legacy && Array.isArray(legacy.extras)) data.extras=legacy.extras;
      if(legacy && Array.isArray(legacy.categories) && legacy.categories.length){
        data.categories.expenses=legacy.categories;
      }
    }
  }
}catch{data=fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
let tab='expenses';const app=document.getElementById('app');
const euro=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.getElementById('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
function monthChecks(selected,limit){return `<div class="field"><label>Fälligkeitsmonate ${limit?`(genau ${limit})`:''}</label><div class="checkboxes">${months.map((m,i)=>`<label class="check"><input type="checkbox" name="due" value="${i}" ${selected.includes(i)?'checked':''}>${shortMonths[i]}</label>`).join('')}</div></div>`}
function countFreq(freq){return ({'Monatlich':12,'Vierteljährlich':4,'Halbjährlich':2,'Jährlich':1})[freq]||1}
function scheduleMonths(entry){if(entry.frequency==='Monatlich')return Array.from({length:12},(_,i)=>i);return entry.months||[]}
function annualAmount(e){return Number(e.amount||0)*countFreq(e.frequency)}
function yearPicker(value){return `<select class="yearsel" id="yearSelect">${Array.from({length:9},(_,i)=>data.activeYear-3+i).map(y=>`<option value="${y}" ${Number(value)===y?'selected':''}>${y}</option>`).join('')}</select>`}
function allCats(section){return data.categories[section]||[]}
function render(){app.innerHTML=({expenses:renderExpenses,income:renderIncome,banks:renderBanks,reports:renderReports,manage:renderManage,backup:renderBackup}[tab])();bind();}
function renderExpenses(){let year=data.activeYear,items=data.expenses;return `<section class="panel"><div class="cardrow"><h2>Fixkosten</h2>${yearPicker(year)}</div><p class="muted">Jährlich geplante Kosten: <b>${euro(items.reduce((s,e)=>s+annualAmount(e),0))}</b> · Monatlicher Durchschnitt: <b>${euro(items.reduce((s,e)=>s+annualAmount(e),0)/12)}</b></p><form id="entryForm"><div class="grid"><div class="field"><label>Rubrik</label><select id="cat" required>${allCats('expenses').map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Unterkategorie</label><select id="subcat" required></select></div><div class="field"><label>Betrag (je Zahlung) €</label><input id="amount" type="number" min="0" step="0.01" required placeholder="0,00"></div><div class="field"><label>Zahlungsweise</label><select id="freq"><option>Monatlich</option><option>Vierteljährlich</option><option>Halbjährlich</option><option>Jährlich</option></select></div></div><div id="dueBox"></div><div class="field"><label>Details (optional)</label><input id="details" placeholder="z. B. Vertragsnummer oder Hinweis"></div><button class="btn" type="submit">Ausgabe hinzufügen</button></form></section><section class="panel"><h2>Jahresübersicht ${year} (Plan)</h2>${summaryTable(items,'expenses')}<div class="actions"><button class="btn light" id="printExpense">Monats- & Jahresübersicht als PDF</button></div></section><section class="panel"><div class="cardrow"><h2>Fälligkeiten im Kalender</h2>${yearPicker(year)}</div><div class="monthgrid">${months.map((m,i)=>{let due=items.filter(e=>scheduleMonths(e).includes(i));return `<div class="monthcard"><h4>${m}<span>${euro(due.reduce((s,e)=>s+Number(e.amount||0),0))}</span></h4>${due.length?due.map(e=>`<div class="due">${esc(e.subcategory)} <b>${euro(e.amount)}</b></div>`).join(''):'<div class="empty">Keine Fälligkeiten</div>'}</div>`}).join('')}</div></section><section class="panel"><h2>Erfasste Fixkosten</h2>${entryList(items,'expenses')}</section><section class="panel"><h2>Katzen & Benzin (separat)</h2><form id="extraForm"><div class="grid3"><div class="field"><label>Bereich</label><select id="extraType"><option>Katzen</option><option>Benzin</option></select></div><div class="field"><label>Jahr</label><input id="extraYear" type="number" value="${year}" required></div><div class="field"><label>Monat</label><select id="extraMonth">${months.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select></div><div class="field"><label>Betrag €</label><input id="extraAmount" type="number" step="0.01" min="0" required></div></div><div class="field"><label>Details</label><input id="extraDetails" placeholder="optional"></div><button class="btn orange">Eintrag speichern</button></form><div>${data.extras.filter(x=>x.year===year).map(x=>`<div class="listitem">${esc(x.type)} · ${months[x.month]} ${x.year} — <b>${euro(x.amount)}</b> <small>${esc(x.details||'')}</small><button class="btn small danger" data-del-extra="${x.id}">Löschen</button></div>`).join('')||'<p class="empty">Noch keine Einträge in diesem Jahr.</p>'}</div></section>`}
function summaryTable(items,section){let cats=allCats(section);return `<div class="tablewrap"><table><thead><tr><th>Rubrik / Unterkategorie</th><th>Jährlich</th></tr></thead><tbody>${cats.map(c=>`<tr><th colspan="2">${esc(c.name)}</th></tr>${c.subs.map(s=>{let total=items.filter(e=>e.category===c.name&&e.subcategory===s).reduce((sum,e)=>sum+annualAmount(e),0);return `<tr><td>${esc(s)}</td><td>${euro(total)}</td></tr>`}).join('')}`).join('')}</tbody></table></div>`}
function entryList(items,section){return items.length?items.map(e=>`<div class="listitem"><div class="top"><div><strong>${esc(e.category)} · ${esc(e.subcategory)}</strong><small>${esc(e.frequency)} · ${e.frequency==='Monatlich'?'jeden Monat':(e.months||[]).map(i=>months[i]).join(', ')}${e.details?' · '+esc(e.details):''}</small></div><div><b>${euro(e.amount)}</b><small> / Zahlung</small></div></div><div class="actions"><button class="btn small light" data-edit="${e.id}" data-section="${section}">Bearbeiten</button><button class="btn small danger" data-delete="${e.id}" data-section="${section}">Löschen</button></div></div>`).join(''):'<div class="empty">Noch keine Einträge vorhanden.</div>'}
function renderIncome(){let items=data.income,year=data.activeYear;return `<section class="panel"><div class="cardrow"><h2>Geldeingänge</h2>${yearPicker(year)}</div><p class="muted">Jährlich geplant: <b>${euro(items.reduce((s,e)=>s+annualAmount(e),0))}</b></p><form id="entryForm"><div class="grid"><div class="field"><label>Rubrik</label><select id="cat">${allCats('income').map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Unterkategorie</label><select id="subcat"></select></div><div class="field"><label>Betrag je Zahlung €</label><input id="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Rhythmus</label><select id="freq"><option>Monatlich</option><option>Vierteljährlich</option><option>Halbjährlich</option><option>Jährlich</option></select></div></div><div id="dueBox"></div><div class="field"><label>Details</label><input id="details" placeholder="optional"></div><button class="btn">Geldeingang hinzufügen</button></form></section><section class="panel"><h2>Jahresübersicht ${year} (Plan)</h2><div class="monthgrid">${months.map((m,i)=>{let due=items.filter(e=>scheduleMonths(e).includes(i));return `<div class="monthcard"><h4>${m}<span>${euro(due.reduce((s,e)=>s+Number(e.amount||0),0))}</span></h4>${due.map(e=>`<div class="due">${esc(e.subcategory)} <b>${euro(e.amount)}</b></div>`).join('')||'<div class="empty">Keine Eingänge</div>'}</div>`}).join('')}</div><p><b>Jahressumme:</b> ${euro(items.reduce((s,e)=>s+annualAmount(e),0))}</p><button class="btn light" id="printIncome">Einnahmen als PDF</button></section><section class="panel"><h2>Erfasste Geldeingänge</h2>${entryList(items,'income')}</section>`}
function renderBanks(){let banks=data.banks,total=banks.reduce((s,b)=>s+Number(b.fpa||0),0),remaining=Number(data.allowance)-total,pct=Math.min(100,Math.max(0,total/Math.max(1,Number(data.allowance))*100));return `<section class="panel"><h2>Freistellungsaufträge im Überblick</h2><div class="grid3"><div class="stat"><small>Sparer-Pauschbetrag (Einzelperson)</small><strong>${euro(data.allowance)}</strong></div><div class="stat"><small>Verteilt</small><strong>${euro(total)}</strong></div><div class="stat"><small>Noch frei</small><strong style="color:${remaining<0?'var(--red)':'var(--green)'}">${euro(remaining)}</strong></div></div><div style="margin-top:10px;background:#f1e4e1;border-radius:20px;height:14px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--orange);border-radius:20px"></div></div><p>${pct.toFixed(0)} % des Pauschbetrags verplant</p>${remaining<0?'<div class="notice alert"><b>Achtung:</b> Die Summe deiner Freistellungsaufträge überschreitet den Pauschbetrag.</div>':''}<div class="field"><label>Gesetzlicher Sparer-Pauschbetrag anpassen (€)</label><input id="allowance" type="number" step="1" min="0" value="${data.allowance}"></div><button class="btn light" id="saveAllowance">Pauschbetrag speichern</button></section><section class="panel"><h2>Bank / Geldanlage hinzufügen</h2><form id="bankForm"><div class="grid"><div class="field"><label>Bank / Institut</label><input id="bankName" required placeholder="z. B. Musterbank"></div><div class="field"><label>Art / Unterkategorie</label><select id="bankType">${allCats('banks').flatMap(c=>c.subs).map(s=>`<option>${esc(s)}</option>`).join('')}<option value="__custom">Eigene Bezeichnung…</option></select></div><div class="field hidden" id="bankCustomWrap"><label>Eigene Art</label><input id="bankCustom"></div><div class="field"><label>Freistellungsauftrag?</label><select id="hasFpa"><option value="no">Nein</option><option value="yes">Ja</option></select></div><div class="field"><label>Freistellungsauftrag €</label><input id="fpa" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Guthaben / Anlagebetrag € (optional)</label><input id="balance" type="number" min="0" step="0.01"></div><div class="field"><label>Stand vom</label><input id="balanceDate" type="date"></div></div><div class="field"><label>Details (Zinsen, Laufzeit, Notizen)</label><textarea id="bankDetails"></textarea></div><button class="btn">Bankverbindung speichern</button></form></section><section class="panel"><h2>Meine Banken und Anlagen</h2>${banks.length?banks.map(b=>`<div class="listitem"><div class="top"><div><strong>${esc(b.name)} <span class="pill">${esc(b.type)}</span></strong><small>Freistellungsauftrag: ${b.hasFpa?euro(b.fpa):'nein'}${b.balance!==''&&b.balance!=null?` · Guthaben ${euro(b.balance)} (${b.balanceDate?new Date(b.balanceDate+'T00:00').toLocaleDateString('de-DE'):'ohne Datum'})`:''}</small><small>${esc(b.details||'')}</small></div></div><div class="actions"><button class="btn small light" data-editbank="${b.id}">Bearbeiten</button><button class="btn small danger" data-deletebank="${b.id}">Löschen</button></div></div>`).join(''):'<div class="empty">Noch keine Bankeinträge.</div>'}<button class="btn light" id="printBanks">Bankenübersicht als PDF</button></section>`}
function renderReports(){return `<section class="panel"><h2>PDF-Auswertungen</h2><p class="notice">Die Berichte zeigen deine wiederkehrenden Planbeträge und Fälligkeiten. Tatsächlich bezahlte oder eingegangene Beträge werden derzeit nicht einzeln gebucht.</p><p>Wähle einen Zeitraum und die Bereiche, die im Bericht erscheinen sollen. Über „Drucken / als PDF sichern“ kannst du auf dem iPhone die PDF speichern.</p><form id="reportForm"><div class="grid"><div class="field"><label>Von</label><input id="reportFrom" type="date" required value="${data.activeYear}-01-01"></div><div class="field"><label>Bis</label><input id="reportTo" type="date" required value="${data.activeYear}-12-31"></div></div><div class="field"><label>Bericht enthält</label><div class="checkboxes"><label class="check"><input type="checkbox" name="reportSection" value="expenses" checked>Fixkosten</label><label class="check"><input type="checkbox" name="reportSection" value="income" checked>Geldeingänge</label><label class="check"><input type="checkbox" name="reportSection" value="banks" checked>Banken</label><label class="check"><input type="checkbox" name="reportSection" value="extras">Katzen/Benzin</label></div></div><div class="field"><label>Darstellung</label><select id="reportMode"><option value="both">Monatsübersicht und Zusammenfassung</option><option value="monthly">Nur Monatsübersicht</option><option value="summary">Nur Zusammenfassung</option></select></div><button class="btn orange">Bericht vorbereiten</button></form><div id="reportResult"></div></section><section class="panel"><h2>Jahresauswertung</h2><div class="field"><label>Jahr</label>${yearPicker(data.activeYear)}</div><p>Jahresberichte lassen sich für jedes gespeicherte Jahr erneut erstellen. Es werden keine Daten beim Jahreswechsel gelöscht.</p><button class="btn light" id="annualReport">Jahresbericht erstellen</button></section>`}
function renderManage(){return `<section class="panel"><h2>Rubriken verwalten</h2><p class="muted">Du kannst Rubriken und Unterkategorien ergänzen. Umbenennen wird in vorhandenen Einträgen mit übernommen. Löschen fragt nach, bevor Einträge entfernt werden.</p><div class="field"><label>Bereich</label><select id="manageSection"><option value="expenses">Fixkosten</option><option value="income">Geldeingänge</option><option value="banks">Banken</option></select></div><div id="categoryManager"></div></section>`}
function renderBackup(){return `<section class="panel"><h2>Daten sichern & wiederherstellen</h2><div class="notice">Deine Daten werden im Browser auf diesem Gerät gespeichert. Lade regelmäßig eine Sicherungsdatei herunter – besonders bevor du die App aktualisierst oder das Gerät wechselst.</div><div class="actions"><button class="btn" id="backupBtn">Daten sichern (JSON)</button><button class="btn light" id="restoreBtn">Sicherung einspielen</button><input type="file" id="restoreFile" accept=".json,application/json" class="hidden"></div><p class="muted">Beim Einspielen einer Sicherung werden die aktuell gespeicherten App-Daten ersetzt. Die Datei wird vor dem Import geprüft.</p><button class="btn danger" id="wipeBtn">Alle App-Daten löschen</button></section><section class="panel"><h2>Hinweise</h2><ul><li>Die App läuft lokal im Browser; es gibt keinen automatischen Cloud-Abgleich.</li><li>PDFs werden über die Druckfunktion des Browsers erstellt.</li><li>Der Sparer-Pauschbetrag ist voreingestellt auf 1.000 € für eine Einzelperson und kann angepasst werden.</li></ul></section>`}
function bind(){let ys=document.querySelectorAll('#yearSelect');ys.forEach(s=>s.onchange=()=>{data.activeYear=Number(s.value);save();render()});if(tab==='expenses'||tab==='income'){const section=tab;fillSub();document.getElementById('cat').onchange=fillSub;document.getElementById('freq').onchange=due;due();document.getElementById('entryForm').onsubmit=e=>{e.preventDefault();let f=document.getElementById('freq').value,sel=[...document.querySelectorAll('input[name=due]:checked')].map(x=>Number(x.value)),needed=f==='Vierteljährlich'?4:f==='Halbjährlich'?2:f==='Jährlich'?1:0;if(needed&&sel.length!==needed){alert(`Bitte genau ${needed} Fälligkeitsmonat${needed===1?'':'e'} auswählen.`);return}let item={id:id(),category:document.getElementById('cat').value,subcategory:document.getElementById('subcat').value,amount:Number(document.getElementById('amount').value),frequency:f,months:sel,details:document.getElementById('details').value};data[section].push(item);save();render()};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Eintrag wirklich löschen?')){data[b.dataset.section]=data[b.dataset.section].filter(x=>x.id!==b.dataset.delete);save();render()}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editEntry(b.dataset.section,b.dataset.edit));if(section==='expenses'){document.getElementById('extraForm').onsubmit=e=>{e.preventDefault();data.extras.push({id:id(),type:document.getElementById('extraType').value,year:Number(document.getElementById('extraYear').value),month:Number(document.getElementById('extraMonth').value),amount:Number(document.getElementById('extraAmount').value),details:document.getElementById('extraDetails').value});save();render()};document.querySelectorAll('[data-del-extra]').forEach(b=>b.onclick=()=>{data.extras=data.extras.filter(x=>x.id!==b.dataset.delExtra);save();render()});document.getElementById('printExpense').onclick=()=>printReport('Fixkosten',makeExpenseReport(data.activeYear));}}
if(tab==='income')document.getElementById('printIncome').onclick=()=>printReport('Geldeingänge',makeIncomeReport(data.activeYear));
if(tab==='banks'){document.getElementById('bankType').onchange=()=>document.getElementById('bankCustomWrap').classList.toggle('hidden',document.getElementById('bankType').value!=='__custom');document.getElementById('hasFpa').onchange=()=>document.getElementById('fpa').disabled=document.getElementById('hasFpa').value!=='yes';document.getElementById('fpa').disabled=true;document.getElementById('saveAllowance').onclick=()=>{data.allowance=Number(document.getElementById('allowance').value);save();render()};document.getElementById('bankForm').onsubmit=e=>{e.preventDefault();let type=document.getElementById('bankType').value;data.banks.push({id:id(),name:document.getElementById('bankName').value,type:type==='__custom'?document.getElementById('bankCustom').value:type,hasFpa:document.getElementById('hasFpa').value==='yes',fpa:document.getElementById('hasFpa').value==='yes'?Number(document.getElementById('fpa').value):0,balance:document.getElementById('balance').value,balanceDate:document.getElementById('balanceDate').value,details:document.getElementById('bankDetails').value});save();render()};document.querySelectorAll('[data-deletebank]').forEach(b=>b.onclick=()=>{if(confirm('Bankeintrag löschen?')){data.banks=data.banks.filter(x=>x.id!==b.dataset.deletebank);save();render()}});document.querySelectorAll('[data-editbank]').forEach(b=>b.onclick=()=>editBank(b.dataset.editbank));document.getElementById('printBanks').onclick=()=>printReport('Banken',makeBankReport());}
if(tab==='manage'){document.getElementById('manageSection').onchange=renderCategories;renderCategories()}
if(tab==='backup'){document.getElementById('backupBtn').onclick=backup;document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=restore;document.getElementById('wipeBtn').onclick=()=>{if(confirm('Wirklich alle Fixkosten-, Einnahmen-, Bank- und Zusatzdaten löschen? Dieser Schritt kann nicht rückgängig gemacht werden.')){data=fresh();save();render()}}}
if(tab==='reports'){document.getElementById('reportForm').onsubmit=e=>{e.preventDefault();let sections=[...document.querySelectorAll('input[name=reportSection]:checked')].map(x=>x.value),from=document.getElementById('reportFrom').value,to=document.getElementById('reportTo').value,mode=document.getElementById('reportMode').value;if(from>to){alert('Das Startdatum muss vor dem Enddatum liegen.');return}let html=makeCustomReport(from,to,sections,mode);document.getElementById('reportResult').innerHTML='<div class="actions"><button class="btn" id="printCustom">Drucken / als PDF sichern</button></div>';document.getElementById('printCustom').onclick=()=>printReport('Finanzbericht',html)};document.getElementById('annualReport').onclick=()=>{let y=data.activeYear;printReport('Jahresbericht '+y,makeAnnualReport(y))}}
}
function fillSub(){let c=document.getElementById('cat').value,category=allCats(tab).find(x=>x.name===c),select=document.getElementById('subcat');select.innerHTML=(category?.subs||[]).map(s=>`<option>${esc(s)}</option>`).join('')}
function due(){let freq=document.getElementById('freq').value,box=document.getElementById('dueBox'),need=freq==='Vierteljährlich'?4:freq==='Halbjährlich'?2:freq==='Jährlich'?1:0;box.innerHTML=need?monthChecks([],need):'<p class="muted">Monatliche Zahlung: wird automatisch in jedem Monat berücksichtigt.</p>'}
function editEntry(section,entryId){
  let e=data[section].find(x=>x.id===entryId); if(!e)return;
  let amount=prompt('Betrag je Zahlung (€):',e.amount); if(amount===null)return;
  if(!Number.isFinite(Number(amount))||Number(amount)<0){alert('Bitte einen gültigen Betrag eingeben.');return}
  let freq=prompt('Zahlungsweise: Monatlich, Vierteljährlich, Halbjährlich oder Jährlich',e.frequency);
  if(freq===null)return;
  const allowed=['Monatlich','Vierteljährlich','Halbjährlich','Jährlich'];
  if(!allowed.includes(freq)){alert('Bitte eine der vier angebotenen Zahlungsweisen verwenden.');return}
  let months=e.months||[];
  if(freq!=='Monatlich'){
    let raw=prompt('Fälligkeitsmonate als Zahlen 1–12, durch Komma getrennt. Anzahl: '+({Vierteljährlich:4,Halbjährlich:2,Jährlich:1}[freq]),months.map(x=>x+1).join(','));
    if(raw===null)return;
    months=raw.split(',').map(x=>Number(x.trim())-1);
    const need={Vierteljährlich:4,Halbjährlich:2,Jährlich:1}[freq];
    if(months.length!==need||months.some(x=>!Number.isInteger(x)||x<0||x>11)||new Set(months).size!==need){
      alert('Die Anzahl der Monate stimmt nicht oder ein Monat ist ungültig.');return;
    }
  } else months=[];
  let details=prompt('Details:',e.details||''); if(details===null)return;
  e.amount=Number(amount);e.frequency=freq;e.months=months;e.details=details;
  save();render();
}
function editBank(bankId){let b=data.banks.find(x=>x.id===bankId);if(!b)return;let n=prompt('Bank / Institut:',b.name);if(n===null)return;let type=prompt('Art / Unterkategorie:',b.type);if(type===null)return;let f=prompt('Freistellungsauftrag (€), 0 falls keiner:',b.fpa);if(f===null)return;let balance=prompt('Guthaben (leer lassen wenn nicht erfasst):',b.balance??'');if(balance===null)return;b.name=n;b.type=type;b.fpa=Number(f)||0;b.hasFpa=b.fpa>0;b.balance=balance;save();render()}
function renderCategories(){let sec=document.getElementById('manageSection').value,cats=allCats(sec),container=document.getElementById('categoryManager');container.innerHTML=`<div class="actions"><button class="btn orange" id="addCat">Rubrik hinzufügen</button><button class="btn light" id="addSub">Unterkategorie hinzufügen</button></div>${cats.map(c=>`<div class="panel"><div class="cardrow"><strong>${esc(c.name)}</strong><div class="actions"><button class="btn small light" data-rencat="${esc(c.name)}">Umbenennen</button><button class="btn small danger" data-delcat="${esc(c.name)}">Löschen</button></div></div>${c.subs.map(s=>`<div class="listitem cardrow">${esc(s)}<div class="actions"><button class="btn small light" data-rensub="${esc(c.name)}|${esc(s)}">Umbenennen</button><button class="btn small danger" data-delsub="${esc(c.name)}|${esc(s)}">Löschen</button><button class="btn small light" data-movesub="${esc(c.name)}|${esc(s)}">Verschieben</button></div></div>`).join('')}</div>`).join('')}`;document.getElementById('addCat').onclick=()=>{let n=prompt('Name der neuen Rubrik:');if(n&&!cats.some(c=>c.name===n)){cats.push({name:n,subs:[]});save();renderCategories()}};document.getElementById('addSub').onclick=()=>{let c=prompt('Zu welcher Rubrik soll die Unterkategorie gehören?\n'+cats.map(c=>c.name).join(', '));let target=cats.find(x=>x.name===c);if(!target)return;let n=prompt('Name der Unterkategorie:');if(n&&!target.subs.includes(n)){target.subs.push(n);save();renderCategories()}};
container.querySelectorAll('[data-rencat]').forEach(b=>b.onclick=()=>{let old=b.dataset.rencat,n=prompt('Neuer Rubrikname:',old);if(!n||n===old)return;if(cats.some(c=>c.name===n)){alert('Diese Rubrik gibt es bereits.');return}let c=cats.find(c=>c.name===old);c.name=n;let secEntries=sec==='expenses'?data.expenses:sec==='income'?data.income:null;if(secEntries)secEntries.forEach(e=>{if(e.category===old)e.category=n});save();renderCategories()});container.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=()=>{let name=b.dataset.delcat,has=sec==='expenses'?data.expenses.some(e=>e.category===name):sec==='income'?data.income.some(e=>e.category===name):false;if(has&&!confirm('In dieser Rubrik liegen Einträge. Rubrik und diese Einträge wirklich löschen?'))return;if(has){let arr=sec==='expenses'?data.expenses:data.income;arr=arr.filter(e=>e.category!==name);if(sec==='expenses')data.expenses=arr;else data.income=arr}data.categories[sec]=cats.filter(c=>c.name!==name);save();renderCategories()});container.querySelectorAll('[data-rensub]').forEach(b=>b.onclick=()=>{let [cat,old]=b.dataset.rensub.split('|'),n=prompt('Neuer Name:',old);if(!n||n===old)return;let c=cats.find(x=>x.name===cat);if(c.subs.includes(n)){alert('Unterkategorie existiert bereits.');return}c.subs[c.subs.indexOf(old)]=n;let arr=sec==='expenses'?data.expenses:sec==='income'?data.income:null;if(arr)arr.forEach(e=>{if(e.category===cat&&e.subcategory===old)e.subcategory=n});if(sec==='banks')data.banks.forEach(b=>{if(b.type===old)b.type=n});save();renderCategories()});container.querySelectorAll('[data-delsub]').forEach(b=>b.onclick=()=>{let [cat,sub]=b.dataset.delsub.split('|'),arr=sec==='expenses'?data.expenses:sec==='income'?data.income:null,has=arr?.some(e=>e.category===cat&&e.subcategory===sub);if(has&&!confirm('Zu dieser Unterkategorie gehören Einträge. Diese ebenfalls löschen?'))return;if(has){if(sec==='expenses')data.expenses=data.expenses.filter(e=>!(e.category===cat&&e.subcategory===sub));else if(sec==='income')data.income=data.income.filter(e=>!(e.category===cat&&e.subcategory===sub));else data.banks=data.banks.filter(b=>b.type!==sub)}cats.find(c=>c.name===cat).subs=cats.find(c=>c.name===cat).subs.filter(s=>s!==sub);save();renderCategories()});container.querySelectorAll('[data-movesub]').forEach(b=>b.onclick=()=>{let [cat,sub]=b.dataset.movesub.split('|'),target=prompt('In welche Rubrik verschieben?\n'+cats.filter(c=>c.name!==cat).map(c=>c.name).join(', '));if(!target||target===cat)return;let dest=cats.find(c=>c.name===target);if(!dest)return;if(!dest.subs.includes(sub))dest.subs.push(sub);cats.find(c=>c.name===cat).subs=cats.find(c=>c.name===cat).subs.filter(s=>s!==sub);let arr=sec==='expenses'?data.expenses:sec==='income'?data.income:null;if(arr)arr.forEach(e=>{if(e.category===cat&&e.subcategory===sub)e.category=target});if(sec==='banks')data.banks.forEach(b=>{if(b.type===sub)b.type=target});save();renderCategories()})}
function backup(){let blob=new Blob([JSON.stringify({format:'Fixkosten Sicherung',version:1,created:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Fixkosten-Sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)}
function restore(ev){let file=ev.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result),candidate=obj.data||obj;if(!candidate.categories||!Array.isArray(candidate.expenses)||!Array.isArray(candidate.income)||!Array.isArray(candidate.banks))throw Error('Datei ist keine gültige Fixkosten-Sicherung.');if(!confirm('Die vorhandenen App-Daten werden durch die Sicherung ersetzt. Fortfahren?'))return;data=candidate;save();render();alert('Sicherung wurde eingespielt.')}catch(err){alert('Import fehlgeschlagen: '+err.message)}};reader.readAsText(file);ev.target.value=''}
function makeExpenseReport(y){let html=`<h1>Fixkosten – ${y}</h1><h2>Jahresübersicht</h2>${summaryTable(data.expenses,'expenses')}<p><b>Gesamt jährlich:</b> ${euro(data.expenses.reduce((s,e)=>s+annualAmount(e),0))}</p>`;months.forEach((m,i)=>{let due=data.expenses.filter(e=>scheduleMonths(e).includes(i));html+=`<div class="printpage"><h1>${m} ${y}</h1><table><tr><th>Rubrik</th><th>Unterkategorie</th><th>Betrag</th><th>Details</th></tr>${due.map(e=>`<tr><td>${esc(e.category)}</td><td>${esc(e.subcategory)}</td><td>${euro(e.amount)}</td><td>${esc(e.details||'')}</td></tr>`).join('')}<tr><th colspan="2">Monatssumme</th><th>${euro(due.reduce((s,e)=>s+Number(e.amount),0))}</th><td></td></tr></table></div>`});return html}
function makeIncomeReport(y){let html=`<h1>Geldeingänge – ${y}</h1><p>Jahressumme: ${euro(data.income.reduce((s,e)=>s+annualAmount(e),0))}</p>`;months.forEach((m,i)=>{let due=data.income.filter(e=>scheduleMonths(e).includes(i));html+=`<div class="printpage"><h2>${m} ${y}</h2><table><tr><th>Rubrik</th><th>Unterkategorie</th><th>Betrag</th><th>Details</th></tr>${due.map(e=>`<tr><td>${esc(e.category)}</td><td>${esc(e.subcategory)}</td><td>${euro(e.amount)}</td><td>${esc(e.details||'')}</td></tr>`).join('')}<tr><th colspan="2">Monatssumme</th><th>${euro(due.reduce((s,e)=>s+Number(e.amount),0))}</th><td></td></tr></table></div>`});return html}
function makeBankReport(){return `<h1>Banken & Geldanlagen</h1><p>Guthaben sind die zuletzt eingetragenen Stichtagswerte und keine automatisch archivierten historischen Jahresstände.</p><p>Freistellungsaufträge: ${euro(data.banks.reduce((s,b)=>s+Number(b.fpa||0),0))} / Pauschbetrag: ${euro(data.allowance)}</p><table><tr><th>Institut</th><th>Art</th><th>Freistellungsauftrag</th><th>Guthaben</th><th>Stand</th><th>Details</th></tr>${data.banks.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.type)}</td><td>${b.hasFpa?euro(b.fpa):'–'}</td><td>${b.balance!==''&&b.balance!=null?euro(b.balance):'–'}</td><td>${esc(b.balanceDate||'–')}</td><td>${esc(b.details||'')}</td></tr>`).join('')}</table>`}
function makeAnnualReport(y){return makeExpenseReport(y)+`<div class="printpage"><h1>Geldeingänge ${y}</h1>${makeIncomeReport(y)}</div><div class="printpage">${makeBankReport()}</div>`}
function makeCustomReport(from,to,sections,mode){let start=new Date(from+'T00:00'),end=new Date(to+'T23:59'),firstMonth=start.getMonth(),lastMonth=end.getMonth(),html=`<h1>Finanzbericht ${start.toLocaleDateString('de-DE')} – ${end.toLocaleDateString('de-DE')}</h1>`;if(sections.includes('expenses')){if(mode!=='monthly')html+=`<h2>Fixkosten – Jahreswerte (wiederkehrender Plan)</h2>${summaryTable(data.expenses,'expenses')}`;if(mode!=='summary')for(let m=firstMonth;m<=lastMonth;m++){html+=`<div class="printpage"><h2>Fixkosten – ${months[m]}</h2><table><tr><th>Rubrik</th><th>Unterkategorie</th><th>Betrag</th></tr>${data.expenses.filter(e=>scheduleMonths(e).includes(m)).map(e=>`<tr><td>${esc(e.category)}</td><td>${esc(e.subcategory)}</td><td>${euro(e.amount)}</td></tr>`).join('')}</table></div>`}}
if(sections.includes('income')){if(mode!=='monthly')html+=`<h2>Geldeingänge – Jahreswerte</h2><p>${euro(data.income.reduce((s,e)=>s+annualAmount(e),0))}</p>`;if(mode!=='summary')for(let m=firstMonth;m<=lastMonth;m++){html+=`<div class="printpage"><h2>Geldeingänge – ${months[m]}</h2><table><tr><th>Unterkategorie</th><th>Betrag</th></tr>${data.income.filter(e=>scheduleMonths(e).includes(m)).map(e=>`<tr><td>${esc(e.subcategory)}</td><td>${euro(e.amount)}</td></tr>`).join('')}</table></div>`}}
if(sections.includes('banks'))html+=`<div class="printpage">${makeBankReport()}</div>`;if(sections.includes('extras'))html+=`<h2>Katzen & Benzin</h2><table><tr><th>Bereich</th><th>Datum</th><th>Betrag</th><th>Details</th></tr>${data.extras.filter(x=>{let d=new Date(x.year,x.month,1);return d>=new Date(start.getFullYear(),start.getMonth(),1)&&d<=new Date(end.getFullYear(),end.getMonth(),1)}).map(x=>`<tr><td>${esc(x.type)}</td><td>${months[x.month]} ${x.year}</td><td>${euro(x.amount)}</td><td>${esc(x.details||'')}</td></tr>`).join('')}</table>`;return html}
function printReport(title,html){let w=window.open('','_blank');if(!w){alert('Pop-up blockiert. Bitte Pop-ups erlauben, um den PDF-Bericht zu öffnen.');return}w.document.write(`<html lang="de"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font:14px Arial;color:#30272a;padding:20px}h1,h2{color:#762b3d}table{width:100%;border-collapse:collapse;margin:10px 0 20px}th,td{border:1px solid #ddd;padding:7px;text-align:left}th{background:#f5e8e4}.printpage{page-break-after:always}@media print{@page{size:A4;margin:14mm}body{padding:0}}</style></head><body>${html}<script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></body></html>`);w.document.close()}
// New-year reminder: only on first app opening in a new year; nothing is deleted.
let nowYear=new Date().getFullYear();
if(data.lastReportPromptYear!==nowYear && nowYear>data.activeYear){
  setTimeout(()=>{
    if(confirm(`Das neue Jahr ${nowYear} hat begonnen. Möchtest du jetzt den Jahresbericht für ${nowYear-1} erstellen?`)){
      printReport('Jahresbericht '+(nowYear-1),makeAnnualReport(nowYear-1));
    }
    data.lastReportPromptYear=nowYear;data.activeYear=nowYear;save();render();
  },700);
}
save();render();
})();
